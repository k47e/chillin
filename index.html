<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>津丘 Chill-In 銷售記錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#0a0b09; --deep:#111410; --panel:#181c15; --card:#1e231a;
  --edge:#2c332a; --fog:#3f4a3c; --mist:#6a7a65; --smoke:#9aaa93;
  --pearl:#ddebd6; --paper:#f0f5eb;
  --gold:#d4a853; --gold-lt:#e8c87a; --gold-glow:rgba(212,168,83,0.18);
  --jade:#4ecb8a; --jade-lt:#7ae8ae; --jade-dim:rgba(78,203,138,0.12);
  --coral:#e06050;
  --r:20px; --r-sm:12px; --r-pill:100px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--pearl);font-family:'Zen Kaku Gothic New',sans-serif;}

/* GRAIN EFFECT */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.6;}

.page{display:none;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--deep);overflow:hidden;}
.page.active{display:flex;}

/* TOP BAR */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:18px 24px 14px;background:var(--deep);border-bottom:1px solid var(--edge);z-index:10;}
.brand-name{font-family:'Noto Serif TC',serif;font-size:19px;font-weight:900;letter-spacing:1px;color:var(--paper);line-height:1;}
.brand-sub{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-top:3px;}

/* BOTTOM NAV */
.bottom-nav{flex-shrink:0;display:flex;background:var(--panel);border-top:1px solid var(--edge);padding:8px 0 20px;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;cursor:pointer;border:none;background:transparent;color:var(--fog);font-size:10px;font-family:'Zen Kaku Gothic New',sans-serif;letter-spacing:0.5px;transition:color 0.18s;}
.nav-btn .nav-icon{font-size:22px;line-height:1;}
.nav-btn.active{color:var(--gold);}

/* MENU AREA */
.menu-area, .mgmt-scroll, .report-scroll, .record-scroll{flex:1;overflow-y:auto;padding:16px 20px 100px;scrollbar-width:none;}
.menu-area::-webkit-scrollbar, .mgmt-scroll::-webkit-scrollbar, .report-scroll::-webkit-scrollbar, .record-scroll::-webkit-scrollbar{display:none;}

/* MENU CARDS */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.menu-card{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;transition:all 0.2s;}
.menu-card-wide{grid-column:1/-1;display:flex;height:120px;}
.card-img{background:var(--panel);overflow:hidden;}
.menu-card-wide .card-img{width:120px;height:100%;flex-shrink:0;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-body{padding:12px;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.card-name{font-size:15px;font-weight:600;color:var(--paper);}
.card-price{font-family:'DM Serif Display',serif;font-size:22px;color:var(--gold-lt);}

/* QTY CONTROL */
.qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:var(--r-pill);padding:2px 8px;border:1px solid var(--edge);}
.qty-btn{width:28px;height:28px;border:none;background:transparent;color:var(--gold);font-size:18px;cursor:pointer;}
.qty-num{font-family:'DM Mono',monospace;font-size:14px;}

/* RECORD ITEMS */
.record-item{background:var(--card);border:1px solid var(--edge);border-radius:var(--r-sm);padding:14px;margin-bottom:10px;cursor:pointer;}
.record-header{display:flex;justify-content:space-between;margin-bottom:8px;}
.record-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--smoke);}
.record-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);}
.record-content{font-size:13px;color:var(--pearl);line-height:1.5;}
.record-footer{margin-top:8px;text-align:right;font-weight:700;color:var(--gold-lt);}

/* DIALOG */
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.dialog{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:24px;width:100%;max-width:350px;}
.dialog-title{font-size:18px;margin-bottom:15px;color:var(--paper);text-align:center;}
.edit-item-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--edge);}
</style>
</head>
<body>

<div class="page active" id="page-pos">
  <div class="topbar"><div class="brand"><div class="brand-name">津丘 Chill-In</div><div class="brand-sub">POS · 點餐</div></div></div>
  <div class="menu-area">
    <div class="menu-grid" id="pos-grid"></div>
  </div>
</div>

<div class="page" id="page-records">
  <div class="topbar"><div class="brand"><div class="brand-name">店餐記錄</div><div class="brand-sub">HISTORY</div></div></div>
  <div class="record-scroll" id="record-list"></div>
</div>

<div class="page" id="page-mgmt">
  <div class="topbar"><div class="brand"><div class="brand-name">菜單修改</div><div class="brand-sub">EDIT MENU</div></div></div>
  <div class="mgmt-scroll">管理內容載入中...</div>
</div>

<div class="page" id="page-report">
  <div class="topbar"><div class="brand"><div class="brand-name">營運報表</div><div class="brand-sub">ANALYSIS</div></div></div>
  <div class="report-scroll">報表數據計算中...</div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showPage('pos')"><span class="nav-icon">🛒</span>點餐</button>
  <button class="nav-btn" onclick="showPage('records')"><span class="nav-icon">📋</span>記錄</button>
  <button class="nav-btn" onclick="showPage('mgmt')"><span class="nav-icon">⚙️</span>菜單修改</button>
  <button class="nav-btn" onclick="showPage('report')"><span class="nav-icon">📊</span>報表</button>
</nav>

<div class="dialog-overlay" id="edit-dialog">
  <div class="dialog">
    <div class="dialog-title">修改訂單內容</div>
    <div id="edit-items-container"></div>
    <button style="width:100%;padding:12px;background:var(--gold);border:none;border-radius:8px;margin-top:10px;" onclick="closeEdit()">儲存修改</button>
  </div>
</div>

<script>
const menuData = [
  {id:'o1', name:'生蠔 (2顆)', price:200, img:'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=400'},
  {id:'rice', name:'金蠔飯', price:330, img:'https://images.unsplash.com/photo-1512058560366-cd242d4586ee?w=400', wide:true},
  {id:'burger', name:'百蝦堡', price:180, img:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400', wide:true},
  {id:'bread', name:'蠔野法棍脆片', price:90, img:'https://images.unsplash.com/photo-1541519227354-08fa5d50c44d?w=400', wide:true}
];

let orders = [
  {id:101, ts: new Date(), items:[{name:'金蠔飯', qty:2}, {name:'生蠔 (2顆)', qty:1}], total:860}
];

function showPage(pId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+pId).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if(pId === 'records') renderRecords();
  if(pId === 'pos') renderPOS();
}

function renderPOS() {
  const grid = document.getElementById('pos-grid');
  grid.innerHTML = menuData.map(m => `
    <div class="menu-card ${m.wide?'menu-card-wide':''}">
      <div class="card-img"><img src="${m.img}"></div>
      <div class="card-body">
        <div class="card-name">${m.name}</div>
        <div class="card-price">$${m.price}</div>
        <button onclick="addOrder('${m.name}', ${m.price})" style="background:var(--gold); border:none; padding:5px 10px; border-radius:5px;">加入</button>
      </div>
    </div>
  `).join('');
}

function renderRecords() {
  const list = document.getElementById('record-list');
  list.innerHTML = orders.map(o => `
    <div class="record-item" onclick="openEdit(${o.id})">
      <div class="record-header">
        <span class="record-date">${o.ts.toLocaleDateString()}</span>
        <span class="record-time">${o.ts.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
      </div>
      <div class="record-content">
        ${o.items.map(i => `${i.name} x ${i.qty}`).join('、')}
      </div>
      <div class="record-footer">總計 $${o.total}</div>
    </div>
  `).join('');
}

let currentEditingId = null;
function openEdit(id) {
  currentEditingId = id;
  const order = orders.find(o => o.id === id);
  const container = document.getElementById('edit-items-container');
  container.innerHTML = order.items.map((item, idx) => `
    <div class="edit-item-row">
      <span>${item.name}</span>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="updateItemQty(${idx}, -1)">-</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="updateItemQty(${idx}, 1)">+</button>
      </div>
    </div>
  `).join('');
  document.getElementById('edit-dialog').style.display = 'flex';
}

function updateItemQty(itemIdx, delta) {
  const order = orders.find(o => o.id === currentEditingId);
  order.items[itemIdx].qty = Math.max(1, order.items[itemIdx].qty + delta);
  // 重新計算總額 (簡化範例：假設價格不變)
  openEdit(currentEditingId);
}

function closeEdit() {
  document.getElementById('edit-dialog').style.display = 'none';
  renderRecords();
}

renderPOS();
</script>
</body>
</html>
